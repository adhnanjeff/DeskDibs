spring:
  application:
    name: deskdibs

  # Every value comes from the environment with a safe localhost default.
  # DB_PASSWORD has no default on purpose: the app must fail loudly rather than
  # start against an unexpected database. Real values live in the gitignored .env.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deskdibs}
    username: ${DB_USER:deskdibs}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: deskdibs-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}

  # Flyway owns the schema. Hibernate only checks that its mappings match what
  # Flyway built — never `update`, never `create`.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  cache:
    type: caffeine

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

deskdibs:
  # Identity. `provider` binds to an enum, so AUTH_PROVIDER=entar stops the
  # application at startup instead of leaving it running with no provider — or,
  # far worse, silently accepting development passwords in production.
  #
  # DESKDIBS_JWT_SECRET and DEV_SEED_PASSWORD deliberately have no default here.
  # A signing key committed to a repository is a signing key anyone can forge
  # tokens with; a default dev password is an account anyone can walk into. Blank
  # means "generate an ephemeral key" and "seed nothing" respectively — both of
  # which say so in the log.
  auth:
    provider: ${AUTH_PROVIDER:local}
    local:
      jwt-secret: ${DESKDIBS_JWT_SECRET:}
      token-ttl: ${DESKDIBS_JWT_TTL:PT8H}
      issuer: ${DESKDIBS_JWT_ISSUER:deskdibs-local}
      audience: ${DESKDIBS_JWT_AUDIENCE:deskdibs-api}
      seed-dev-users: ${DEV_SEED_USERS:true}
      seed-password: ${DEV_SEED_PASSWORD:}
    entra:
      tenant-id: ${ENTRA_TENANT_ID:}
      client-id: ${ENTRA_CLIENT_ID:}
      # Overrides for a sovereign cloud only; derived from the tenant when blank.
      issuer: ${ENTRA_ISSUER:}
      jwk-set-uri: ${ENTRA_JWK_SET_URI:}

  # Office rules are configuration, never hardcoded. Dates and cut-offs resolve
  # server-side in this timezone; the client clock is never trusted.
  office:
    timezone: ${OFFICE_TIMEZONE:Asia/Kolkata}
    booking-horizon-days: ${BOOKING_HORIZON_DAYS:14}
    team-block-release-time: ${TEAM_BLOCK_RELEASE_TIME:10:00}
    # Days the office is open. A desk cannot be booked for any other day — enforced by the
    # booking rules, not merely greyed out in the date strip.
    working-days: ${OFFICE_WORKING_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}
    no-show-release-time: ${NO_SHOW_RELEASE_TIME:11:00}
    # Check-in is a claim that you are in the building, so it does not open at midnight.
    # Between this hour and no-show-release-time is the window somebody has to confirm.
    check-in-opens-time: ${CHECK_IN_OPENS_TIME:07:00}
    # After this, the date strip stops offering today: the day is underway and the no-show
    # release has already handed back the desks nobody claimed. Defaults to the same hour.
    same-day-cutoff-time: ${SAME_DAY_CUTOFF_TIME:11:00}
    # Cron day-of-week field for the no-show release. Mon-Fri until IT confirms the
    # office's working days (PLAN.md §12).
    no-show-release-days: ${NO_SHOW_RELEASE_DAYS:MON-FRI}

  # Per-user throttle on booking mutations (PLAN.md §5 #14). A politeness limit, never a
  # correctness one — the anti-double-booking guarantee is the partial unique index and
  # nothing else, so turning this off cannot produce a double booking.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    booking-ops-per-minute: ${RATE_LIMIT_BOOKING_OPS_PER_MINUTE:30}
    bucket-ttl: ${RATE_LIMIT_BUCKET_TTL:PT10M}

  # The no-show release is the only scheduled work in the system. Switched off across
  # the test suite, which drives NoShowReleaseService directly against a movable clock
  # rather than waiting for a trigger to fire.
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}

  # Browser origins allowed to call the API and open the /ws STOMP endpoint. Exact
  # origins only, never a wildcard — see CorsProperties/WebCorsConfiguration.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173, http://localhost:5174}

logging:
  level:
    com.deskdibs: INFO
